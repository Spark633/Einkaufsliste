<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d5b">
  <title>Einkaufsliste</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24"><path d="M15.4 6.4 14 5l-7 7 7 7 1.4-1.4L9.8 12z"/></svg>
    </button>
    <h1 id="title">Meine Listen</h1>
    <button id="btn-menu" class="icon-btn" aria-label="Menü">
      <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>
    </button>
  </header>

  <!-- Übersicht aller Listen -->
  <main id="view-lists" class="view">
    <ul id="lists" class="cards"></ul>
    <p id="lists-empty" class="empty" hidden>Noch keine Liste. Tippe auf <b>+</b>, um eine anzulegen.</p>
    <button id="btn-new-list" class="fab" aria-label="Neue Liste">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    </button>
  </main>

  <!-- Einzelne Liste -->
  <main id="view-list" class="view" hidden>
    <form id="add-form" class="add-bar" autocomplete="off">
      <input id="add-input" type="text" placeholder="Artikel hinzufügen …" enterkeyhint="done" autocapitalize="sentences">
      <button type="submit" class="add-btn" aria-label="Hinzufügen">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
    </form>
    <div id="suggestions" class="suggestions" hidden></div>

    <ul id="items-open" class="items"></ul>
    <p id="items-empty" class="empty" hidden></p>

    <div id="done-section" hidden>
      <div class="section-head">
        <span id="done-count">Erledigt</span>
        <button id="btn-clear-done" class="text-btn">Erledigte entfernen</button>
      </div>
      <ul id="items-done" class="items"></ul>
    </div>
  </main>

  <!-- Dialog (wird per JS befüllt) -->
  <div id="overlay" class="overlay" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="snackbar" class="snackbar" hidden>
    <span id="snackbar-text"></span>
    <button id="snackbar-action" class="text-btn"></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
