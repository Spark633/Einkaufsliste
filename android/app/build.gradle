plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Versionsnummer kommt aus dem GitHub-Actions-Lauf, damit sich Updates installieren lassen
def buildNumber = (project.findProperty('buildNumber') ?: '1') as int

android {
    namespace 'de.einkaufsliste.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.einkaufsliste.app'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "2.0.${buildNumber}"
    }

    signingConfigs {
        // Fester Schlüssel im Repo: Jede neue APK lässt sich über die alte installieren,
        // ohne dass die gespeicherten Listen verloren gehen.
        app {
            storeFile file('app.keystore')
            storePassword 'einkaufsliste'
            keyAlias 'einkaufsliste'
            keyPassword 'einkaufsliste'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
}
