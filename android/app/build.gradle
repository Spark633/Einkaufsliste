plugins {
    id 'com.android.application'
}

// Versionsnummer kommt aus dem GitHub-Actions-Lauf, damit sich Updates installieren lassen
def buildNumber = (project.findProperty('buildNumber') ?: '1') as int

android {
    namespace 'de.einkaufsliste.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.einkaufsliste.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // Fester Schlüssel im Repo: Jede neue APK lässt sich über die alte installieren,
        // ohne dass die gespeicherten Listen verloren gehen.
        app {
            storeFile file('app.keystore')
            storePassword 'einkaufsliste'
            keyAlias 'einkaufsliste'
            keyPassword 'einkaufsliste'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }

    sourceSets {
        main {
            // Die Web-App aus /web wird als Asset eingebettet
            assets.srcDirs += ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
