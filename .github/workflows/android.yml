name: Android-App bauen

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versionsnummer festlegen
        # Fortlaufend über alle bisherigen Builds, damit sich Updates über bestehende Installationen installieren lassen
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ env.BUILD_NUMBER }}
          cp app/build/outputs/apk/release/app-release.apk ../Einkaufsliste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Einkaufsliste-apk
          path: Einkaufsliste.apk

      - name: Als GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ env.BUILD_NUMBER }}
          name: Einkaufsliste 2.0.${{ env.BUILD_NUMBER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Einkaufsliste.apk
          body: |
            APK auf dem Handy herunterladen und öffnen, um die App zu installieren bzw. zu aktualisieren.
            Die gespeicherten Listen bleiben bei einem Update erhalten.
